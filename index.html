<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Parkour</title><style>body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#18243a;border:1px solid #2b3b58;border-radius:22px;padding:28px}input,button{font:inherit;padding:12px;border-radius:12px}input{background:#0f1828;color:white;border:1px solid #3b4d6b;width:100%;margin:6px 0}button{background:#39d98a;border:0;font-weight:800;cursor:pointer}.secondary{background:#2b3a55;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.skin{background:#111b2b;border:2px solid #33445f;border-radius:16px;padding:8px;text-align:center;cursor:pointer}.skin.selected{border-color:#39d98a}.skin canvas{width:100%;height:125px;image-rendering:pixelated}.row,.top{display:flex;gap:10px}.row>*{flex:1}.status,.hud{padding:12px;border-radius:12px;background:#0d1625;margin-top:12px}.top{justify-content:space-between;flex-wrap:wrap}.hud{background:#18243a}#game{display:none}#world{width:100%;height:auto;margin-top:14px;border-radius:16px;image-rendering:pixelated}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}</style></head><body><div class="wrap"><div class="card" id="lobby"><h1>⚡ Energy Parkour</h1><p>Choose your slime, enter a room, answer questions, and race.</p><input id="name" maxlength="18" placeholder="Your name"><div class="row"><input id="room" maxlength="12" placeholder="Room code"><button id="random" class="secondary">Random</button></div><h3>Choose your slime</h3><div class="grid" id="skins"></div><button id="join">Join room</button><div class="status" id="status">Ready.</div></div><div id="game"><div class="top"><div class="hud">Room: <b id="roomLabel"></b></div><div class="hud">Energy: <b id="energy">0</b> ⚡</div><div class="hud">Players: <b id="players">0</b></div></div><canvas id="world" width="1100" height="520"></canvas><div class="status" id="gameStatus">A/D or arrows to move • Space to jump.</div><button id="question" class="secondary">Question</button></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getDatabase,ref,set,onValue,onDisconnect,update}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBWNpcyk0wEnXBn3e8zPFX-VfrMt8RY43k",authDomain:"gimbit-2b06c.firebaseapp.com",databaseURL:"https://gimbit-2b06c-default-rtdb.firebaseio.com",projectId:"gimbit-2b06c",storageBucket:"gimbit-2b06c.firebasestorage.app",messagingSenderId:"150374921749",appId:"1:150374921749:web:c9b763639c15e64aa5c01c",measurementId:"G-NLVS9J3MXP"}),auth=getAuth(app),db=getDatabase(app);
const sheet=new Image();sheet.src="assets/slime_sprites.png";const background=new Image();background.src="assets/background.png";const sprites=[{name:"Green",sx:20,sy:168,sw:180,sh:132},{name:"Cyan",sx:220,sy:168,sw:180,sh:132},{name:"Red",sx:430,sy:168,sw:180,sh:132},{name:"Orange",sx:20,sy:332,sw:180,sh:128},{name:"Yellow",sx:220,sy:332,sw:180,sh:128},{name:"Brown",sx:430,sy:332,sw:180,sh:128}];let selected=0;const skins=document.getElementById('skins');function draw(c,s){let x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(sheet,s.sx,s.sy,s.sw,s.sh,0,0,c.width,c.height)}sprites.forEach((s,i)=>{let d=document.createElement('div');d.className='skin'+(i?'':' selected');let c=document.createElement('canvas');c.width=180;c.height=125;d.append(c);let b=document.createElement('b');b.textContent=s.name;d.append(b);skins.append(d);d.onclick=()=>{selected=i;document.querySelectorAll('.skin').forEach(x=>x.classList.remove('selected'));d.classList.add('selected')};let f=()=>draw(c,s);sheet.complete?f():sheet.addEventListener('load',f,{once:true})});const $=id=>document.getElementById(id);$('random').onclick=()=>{$('room').value=Math.random().toString(36).slice(2,8).toUpperCase()};$('random').click();let uid=null,room='',playerRef=null,players={},me={x:100,y:390,vx:0,vy:0,energy:0};const qs=[["What is 7 × 8?","56"],["What is 15 + 27?","42"],["What is 81 ÷ 9?","9"],["What is 12 × 6?","72"]];$('join').onclick=async()=>{try{$('status').textContent='Connecting...';room=$('room').value.trim().toUpperCase();if(!room){$('status').textContent='Enter a room code.';return}let cred=await signInAnonymously(auth);uid=cred.user.uid;playerRef=ref(db,`rooms/${room}/players/${uid}`);await set(playerRef,{name:$('name').value.trim()||'Player',skin:selected,x:100,y:390,energy:0,finished:false,updated:Date.now()});onDisconnect(playerRef).remove();onValue(ref(db,`rooms/${room}/players`),s=>{players=s.val()||{};$('players').textContent=Object.keys(players).length});$('roomLabel').textContent=room;$('lobby').style.display='none';$('game').style.display='block';requestAnimationFrame(loop)}catch(e){$('status').textContent='Join failed: '+e.code+' — '+e.message;console.error(e)}};$('question').onclick=()=>{let q=qs[Math.floor(Math.random()*qs.length)],a=prompt(q[0]);if(a===null)return;if(a.trim()===q[1]){me.energy+=10;$('gameStatus').textContent='Correct! +10 energy.'}else{me.energy=Math.max(0,me.energy-2);$('gameStatus').textContent='Wrong. -2 energy.'}if(playerRef)update(playerRef,{energy:me.energy,updated:Date.now()})};const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;const c=$('world'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const platforms=[[0,450,300,35],[360,390,230,35],[650,325,220,35],[930,255,260,35],[1250,350,250,35],[1570,290,250,35],[1880,220,300,35]];let cam=0,last=performance.now();function slime(i,x,y){let s=sprites[i]||sprites[0];ctx.drawImage(sheet,s.sx,s.sy,s.sw,s.sh,x,y,74,58)}function loop(t){let dt=Math.min(.032,(t-last)/1000);last=t;let speed=190+me.energy*2;if(keys.a||keys.arrowleft)me.vx=-speed;else if(keys.d||keys.arrowright)me.vx=speed;else me.vx*=.82;if((keys[' ']||keys.w||keys.arrowup)&&me.y>=390)me.vy=-470;me.vy+=1200*dt;me.x+=me.vx*dt;me.y+=me.vy*dt;for(let p of platforms)if(me.vy>=0&&me.x+40>p[0]&&me.x-40<p[0]+p[2]&&me.y+58>=p[1]&&me.y+58<=p[1]+40){me.y=p[1]-58;me.vy=0}if(me.y>650){me.x=100;me.y=390;me.vy=0}cam=Math.max(0,me.x-300);ctx.clearRect(0,0,c.width,c.height);if(background.complete){let scale=Math.max(c.width/background.naturalWidth,c.height/background.naturalHeight);let bw=background.naturalWidth*scale,bh=background.naturalHeight*scale;let bx=-(cam*.08%bw);ctx.globalAlpha=1;ctx.drawImage(background,bx,0,bw,bh);if(bx+bw<c.width)ctx.drawImage(background,bx+bw,0,bw,bh);if(bx>0)ctx.drawImage(background,bx-bw,0,bw,bh)}else{ctx.fillStyle='#7dd8f5';ctx.fillRect(0,0,c.width,c.height)}for(let p of platforms){ctx.fillStyle='#5b718d';ctx.fillRect(p[0]-cam,p[1],p[2],p[3])}for(let[id,p]of Object.entries(players)){if(id===uid)continue;let x=p.x-cam;if(x>-100&&x<c.width+100){slime(p.skin||0,x-37,p.y);ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(p.name||'Player',x,p.y-8)}}slime(selected,me.x-cam-37,me.y);ctx.fillStyle='#39d98a';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText($('name').value.trim()||'Player',me.x-cam,me.y-8);$('energy').textContent=Math.round(me.energy);if(playerRef)update(playerRef,{x:me.x,y:me.y,energy:me.energy,skin:selected,updated:Date.now()});requestAnimationFrame(loop)}
</script></body></html>
